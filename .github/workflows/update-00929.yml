name: 更新00929資料

on:
  schedule:
    # 台北時間週一至週五14:40(收盤後)與20:40(晚間公告後)
    - cron: '40 6 * * 1-5'
    - cron: '40 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-00929.mjs
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add 00929/data.json
          if git diff --cached --quiet; then echo "無變動"; exit 0; fi
          git commit -m "更新00929資料"
          git push
