<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMA提單批次查詢</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#fff;color:#111;margin:0 auto;padding:16px;max-width:720px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:12px;color:#666;margin:0 0 16px}
  textarea,input{width:100%;padding:8px;font-size:15px;border:1px solid #999;border-radius:4px;font-family:inherit}
  textarea{height:120px;text-transform:uppercase}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{flex:1;min-width:120px;padding:11px;font-size:15px;border:1px solid #111;border-radius:4px;background:#fff;color:#111;cursor:pointer}
  .btn.dark{background:#111;color:#fff}
  .btn:disabled{opacity:.4}
  .progress{margin:16px 0 8px;font-size:14px;display:flex;justify-content:space-between}
  .bar{height:6px;background:#eee;border-radius:3px;margin-bottom:12px}
  .bar div{height:100%;background:#111;border-radius:3px;width:0}
  .item{border:1px solid #ccc;border-radius:6px;padding:10px;margin-bottom:8px}
  .item.done{border-color:#111;background:#f5f5f5}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .bl{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .open{font-size:13px;padding:6px 12px;border:1px solid #111;border-radius:4px;background:#fff;cursor:pointer}
  .fields{display:grid;grid-template-columns:1fr 1fr 2fr;gap:6px}
  .fields label{font-size:11px;color:#555;display:block;margin-bottom:2px}
  .fields input{font-size:14px;padding:6px}
  .note{font-size:11px;color:#777;margin-top:16px;line-height:1.6}
  @media(max-width:480px){.fields{grid-template-columns:1fr 1fr}.fields div:last-child{grid-column:1/3}}
</style>
</head>
<body>
<h1>CMA提單批次查詢</h1>
<p class="sub">可直接從Excel整欄複製貼上，自動去除重複</p>

<textarea id="input" placeholder="一行一個提單號碼"></textarea>
<div class="row">
  <button class="btn dark" onclick="load()">建立清單</button>
  <button class="btn" onclick="clearAll()">清空</button>
</div>

<div id="panel" style="display:none">
  <div class="progress"><span id="prog">0/0</span><span id="pct">0%</span></div>
  <div class="bar"><div id="barIn"></div></div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn dark" id="nextBtn" onclick="openNext()">開啟下一筆未查</button>
    <button class="btn" id="copyBtn" onclick="copyTsv()">複製到Excel</button>
  </div>
  <div id="list"></div>
</div>

<p class="note">
點開啟時會同時把提單號碼複製到剪貼簿；若CMA頁面沒有自動帶入號碼，直接貼上查詢即可。<br>
填入ETA或ATA後，該筆會自動標示為已查。<br>
資料只存在目前這個瀏覽器分頁，關閉或重新整理後會清空，查完請先複製到Excel。
</p>

<script>
  // CMA查詢網址格式，若無法自動帶入號碼可在此調整
  const CMA_URL = bl => `https://www.cma-cgm.com/ebusiness/tracking/search?SearchBy=BL&Reference=${encodeURIComponent(bl)}`;

  let items = [];

  function load(){
    const raw = document.getElementById('input').value
      .split(/[\s,;]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
    const uniq = [...new Set(raw)];
    if(!uniq.length) return;
    const old = Object.fromEntries(items.map(i=>[i.bl,i]));
    items = uniq.map(bl => old[bl] || { bl, eta:'', pod:'', note:'', opened:false });
    document.getElementById('panel').style.display = 'block';
    render();
  }

  function clearAll(){
    if(items.length && !confirm('確定清空所有資料?')) return;
    items = [];
    document.getElementById('input').value = '';
    document.getElementById('panel').style.display = 'none';
  }

  function isDone(i){ return i.eta.trim() !== ''; }

  function render(){
    document.getElementById('list').innerHTML = items.map((i,k)=>`
      <div class="item ${isDone(i)?'done':''}" id="it${k}">
        <div class="head">
          <span class="bl">${k+1}. ${esc(i.bl)}${isDone(i)?' ✓':''}</span>
          <button class="open" onclick="openOne(${k})">${i.opened?'再開一次':'開啟查詢'}</button>
        </div>
        <div class="fields">
          <div><label>ETA/ATA</label><input value="${esc(i.eta)}" placeholder="例:10/15" oninput="upd(${k},'eta',this.value)"></div>
          <div><label>到港地</label><input value="${esc(i.pod)}" placeholder="例:KEL" oninput="upd(${k},'pod',this.value)"></div>
          <div><label>備註</label><input value="${esc(i.note)}" placeholder="例:轉運延誤" oninput="upd(${k},'note',this.value)"></div>
        </div>
      </div>`).join('');
    progress();
  }

  function upd(k, f, v){
    items[k][f] = v;
    const el = document.getElementById('it'+k);
    const done = isDone(items[k]);
    el.classList.toggle('done', done);
    el.querySelector('.bl').textContent = `${k+1}. ${items[k].bl}${done?' ✓':''}`;
    progress();
  }

  function progress(){
    const n = items.length, d = items.filter(isDone).length;
    const p = n ? Math.round(d/n*100) : 0;
    document.getElementById('prog').textContent = `已查${d}/${n}筆`;
    document.getElementById('pct').textContent = p + '%';
    document.getElementById('barIn').style.width = p + '%';
    document.getElementById('nextBtn').disabled = d === n;
  }

  function openOne(k){
    const i = items[k];
    navigator.clipboard && navigator.clipboard.writeText(i.bl).catch(()=>{});
    window.open(CMA_URL(i.bl), '_blank');
    if(!i.opened){
      i.opened = true;
      document.querySelector(`#it${k} .open`).textContent = '再開一次';
    }
  }

  function openNext(){
    const k = items.findIndex(i=>!isDone(i) && !i.opened);
    const k2 = k >= 0 ? k : items.findIndex(i=>!isDone(i));
    if(k2 < 0) return;
    openOne(k2);
    document.getElementById('it'+k2).scrollIntoView({behavior:'smooth', block:'center'});
  }

  function copyTsv(){
    const head = ['提單號碼','ETA/ATA','到港地','備註'];
    const body = items.map(i=>[i.bl, i.eta, i.pod, i.note]);
    const tsv = [head, ...body].map(a=>a.map(x=>String(x).replace(/\t|\n/g,' ')).join('\t')).join('\n');
    navigator.clipboard.writeText(tsv).then(()=>{
      const b = document.getElementById('copyBtn');
      b.textContent = '已複製'; setTimeout(()=>b.textContent='複製到Excel',1500);
    });
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  window.addEventListener('beforeunload', e=>{
    if(items.some(i=>i.eta||i.pod||i.note)){ e.preventDefault(); e.returnValue=''; }
  });
</script>
</body>
</html>
