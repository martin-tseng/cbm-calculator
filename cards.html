<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信用卡每月檢查</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#fff;color:#111;margin:0 auto;padding:16px;max-width:600px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{font-size:12px;color:#666;margin:0 0 12px}
  .ask{border:2px solid #111;border-radius:8px;padding:12px;margin-bottom:16px}
  .ask-title{font-size:16px;font-weight:700;margin-bottom:8px}
  #q{width:100%;padding:10px;font-size:16px;border:1px solid #999;border-radius:4px;font-family:inherit}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip-btn{font-size:13px;padding:5px 11px;border:1px solid #999;border-radius:14px;background:#fff;cursor:pointer;color:#111}
  .chip-btn.on{background:#111;color:#fff;border-color:#111}
  .rk-head{font-size:12px;color:#666;margin:12px 0 6px}
  .rk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eee}
  .rk-no{flex:none;width:20px;font-size:15px;font-weight:700;text-align:center}
  .rk-face{flex:none;width:44px;height:28px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .rk-info{flex:1;min-width:0}
  .rk-name{font-size:14px;font-weight:600}
  .rk-note{font-size:11px;color:#666;line-height:1.4}
  .rk-rate{flex:none;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .rk-rate small{font-size:12px}
  .rk.first .rk-rate{font-size:24px}
  .rk-tag{display:inline-block;font-size:10px;padding:0 5px;border:1px solid #999;border-radius:8px;color:#555;margin-left:4px;vertical-align:1px}
  .more{width:100%;margin-top:6px;padding:7px;font-size:13px;border:1px solid #999;background:#fff;border-radius:4px;cursor:pointer}
  .month{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
  .month button{border:1px solid #111;background:#fff;border-radius:4px;padding:6px 12px;font-size:16px;cursor:pointer}
  .month span{font-size:18px;font-weight:700}
  .progress{display:flex;justify-content:space-between;font-size:14px}
  .bar{height:6px;background:#eee;border-radius:3px;margin:4px 0 16px}
  .bar div{height:100%;background:#111;border-radius:3px;width:0}
  .filter{display:flex;gap:6px;margin-bottom:10px}
  .filter button{flex:1;padding:7px;font-size:13px;border:1px solid #999;background:#fff;border-radius:4px;cursor:pointer}
  .filter button.on{background:#111;color:#fff;border-color:#111}
  .card{border:1px solid #ccc;border-radius:6px;padding:10px;margin-bottom:8px}
  .card.done{background:#f5f5f5;border-color:#111}
  .top{display:flex;align-items:center;gap:12px}
  .face{position:relative;flex:none;width:112px;height:70px;border-radius:8px;cursor:pointer;overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,.25);transition:filter .2s,transform .1s;-webkit-tap-highlight-color:transparent}
  .face:active{transform:scale(.96)}
  .face::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px)}
  .face::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-30px;top:-38px;background:rgba(255,255,255,.12)}
  .chip{position:absolute;left:12px;top:24px;width:20px;height:15px;border-radius:3px;
    background:linear-gradient(135deg,#e8d9a8,#b89d5c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .chip::after{content:"";position:absolute;left:6px;top:0;bottom:0;width:8px;border-left:1px solid rgba(0,0,0,.2);border-right:1px solid rgba(0,0,0,.2)}
  .wave{position:absolute;left:38px;top:26px;width:12px;height:12px;border:2px solid rgba(255,255,255,.55);border-left:0;border-bottom:0;border-radius:0 12px 0 0;transform:rotate(45deg)}
  .dots{position:absolute;left:12px;bottom:10px;font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.7);font-family:monospace}
  .no{position:absolute;right:10px;bottom:8px;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);font-family:monospace}
  .tick{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);
    color:#fff;font-size:30px;font-weight:700;z-index:2}
  .card.done .face{filter:grayscale(1) brightness(.85)}
  .card.done .tick{display:flex}
  .meta{flex:1;min-width:0}
  .name{font-weight:700;font-size:15px;line-height:1.35}
  .card.done .name{color:#666}
  .hint{font-size:11px;color:#888;margin-top:2px}
  .due{display:inline-block;margin-top:4px;font-size:11px;padding:2px 7px;border:1px solid #111;border-radius:10px}
  .due.soon{background:#111;color:#fff}
  ul{margin:10px 0 4px 18px;padding:0;font-size:13px;line-height:1.6;color:#222}
  .reg{font-size:12px;color:#555}
  .row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .use{flex:1;border:0;border-bottom:1px dashed #bbb;font-size:13px;padding:3px 0;background:transparent;color:#444}
  .src{flex:none;font-size:12px;color:#111}
  details{margin-top:16px}
  summary{cursor:pointer;font-size:14px;font-weight:600}
  textarea{width:100%;padding:8px;font-size:14px;border:1px solid #999;border-radius:4px;font-family:inherit}
  .btn{width:100%;padding:10px;font-size:14px;border:1px solid #111;border-radius:4px;background:#fff;cursor:pointer;margin-top:8px}
  .note{font-size:11px;color:#777;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<h1>信用卡每月檢查</h1>
<p class="sub" id="updated">載入優惠資料中...</p>

<div class="ask">
  <div class="ask-title">這筆該刷哪張?</div>
  <input id="q" placeholder="輸入通路,例:超商、蝦皮、日本、加油" oninput="rank(this.value)" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div id="rankOut"></div>
</div>

<div class="month">
  <button onclick="shift(-1)">‹</button>
  <span id="monthLabel"></span>
  <button onclick="shift(1)">›</button>
</div>
<div class="progress"><span id="prog"></span><span id="pct"></span></div>
<div class="bar"><div id="barIn"></div></div>

<div class="filter">
  <button class="on" data-f="all" onclick="setFilter('all')">全部</button>
  <button data-f="todo" onclick="setFilter('todo')">未刷</button>
  <button data-f="done" onclick="setFilter('done')">已刷</button>
  <button data-f="soon" onclick="setFilter('soon')">即將截止</button>
</div>

<div id="list"></div>

<details>
  <summary>備份與還原</summary>
  <p class="note">打勾與用途紀錄只存在這台裝置的瀏覽器，換手機前請先複製備份碼。</p>
  <button class="btn" onclick="backup()">複製備份碼</button>
  <textarea id="restoreBox" placeholder="貼上備份碼" style="height:80px;margin-top:8px"></textarea>
  <button class="btn" onclick="restore()">還原</button>
</details>

<p class="note">
優惠整理自公開比較網站，實際內容以銀行官網公告為準。<br>
即將截止=活動截止日在30天內。
</p>

<script>
  const KEY = 'card-check-v1';
  let offers = [];
  let state = load();
  let cur = ym(new Date());
  let filter = 'all';

  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY)) || {};
      return { uses:s.uses||{}, months:s.months||{} };
    }catch(e){ return { uses:{}, months:{} }; }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function ym(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

  function daysLeft(s){
    if(!s) return null;
    const [y,m,d] = s.split('/').map(Number);
    const end = new Date(y, m-1, d, 23, 59);
    return Math.ceil((end - new Date()) / 86400000);
  }

  function shift(n){
    const [y,m] = cur.split('-').map(Number);
    cur = ym(new Date(y, m-1+n, 1));
    render();
  }
  function setFilter(f){
    filter = f;
    document.querySelectorAll('.filter button').forEach(b=>b.classList.toggle('on', b.dataset.f===f));
    render();
  }
  function toggle(name, on){
    state.months[cur] = state.months[cur] || {};
    if(on) state.months[cur][name] = true; else delete state.months[cur][name];
    save(); render();
  }
  function setUse(name, v){ state.uses[name] = v; save(); }

  // 查詢:關鍵字對應通路分類
  const CATS = [
    {key:'超商', words:['超商','便利商店','7-11','711','小七','seven','全家','萊爾富','ok超商']},
    {key:'網購', words:['網購','momo','蝦皮','pchome','淘寶','amazon','酷澎','coupang','購物網','網路購物']},
    {key:'外送', words:['外送','ubereats','uber eats','foodpanda','熊貓']},
    {key:'串流', words:['串流','訂閱','netflix','spotify','youtube','disney','chatgpt','claude','kkbox']},
    {key:'餐飲', words:['餐飲','餐廳','吃飯','咖啡','美食','聚餐']},
    {key:'加油', words:['加油','中油','台塑','油錢']},
    {key:'LINE Pay', words:['linepay','line pay','行動支付','街口']},
    {key:'Costco', words:['costco','好市多','科斯特']},
    {key:'日本', words:['日本','東京','大阪','京都','北海道','沖繩','日幣']},
    {key:'海外', words:['海外','國外','出國','韓國','歐洲','美國','外幣','泰國']},
    {key:'旅遊', words:['旅遊','機票','訂房','飯店','航空','旅行社']},
    {key:'一般', words:['一般','其他','國內','繳費']}
  ];
  const DOMESTIC = ['超商','網購','外送','串流','餐飲','加油','LINE Pay','Costco','旅遊','一般'];
  let curCat = null, showAll = false;

  function findCat(q){
    const s = q.trim().toLowerCase().replace(/\s+/g,' ');
    if(!s) return null;
    return CATS.find(c => c.key.toLowerCase()===s || c.words.some(w => s.includes(w) || w.includes(s) && s.length>=2)) || null;
  }

  function rateOf(c, cat){
    const r = c.rates || {};
    if(r[cat]) return {...r[cat], exact:true};
    if(cat==='日本' && r['海外']) return {...r['海外'], exact:false, base:'海外回饋'};
    if(DOMESTIC.includes(cat) && cat!=='一般' && r['一般']) return {...r['一般'], exact:false, base:'一般回饋'};
    return null;
  }

  function pickChip(k){
    document.getElementById('q').value = k;
    rank(k);
  }

  function rank(q){
    const cat = typeof q==='string' ? findCat(q) : null;
    curCat = cat ? cat.key : null;
    showAll = false;
    document.querySelectorAll('.chip-btn').forEach(b=>b.classList.toggle('on', b.dataset.k===curCat));
    drawRank(q);
  }

  function drawRank(q){
    const out = document.getElementById('rankOut');
    if(!curCat){
      out.innerHTML = q && q.trim() ? '<div class="rk-head">找不到對應的通路，試試上方分類</div>' : '';
      return;
    }
    const done = state.months[cur] || {};
    const list = offers.map((c,i)=>({c,i,r:rateOf(c,curCat)}))
      .filter(x=>x.r)
      .sort((a,b)=> b.r.rate-a.r.rate || (b.r.exact?1:0)-(a.r.exact?1:0));
    const shown = showAll ? list : list.slice(0,5);
    out.innerHTML = `<div class="rk-head">${esc(curCat)}:共${list.length}張可用，依回饋率排序</div>` +
      shown.map((x,k)=>{
        const note = [x.r.base, x.r.note].filter(Boolean).join('；');
        return `<div class="rk ${k===0?'first':''}">
          <span class="rk-no">${k+1}</span>
          <span class="rk-face" style="background:${faceBg(x.i)}"></span>
          <div class="rk-info">
            <div class="rk-name">${esc(x.c.name)}${done[x.c.name]?'':'<span class="rk-tag">本月未刷</span>'}</div>
            ${note?`<div class="rk-note">${esc(note)}</div>`:''}
          </div>
          <span class="rk-rate">${x.r.rate}<small>%</small></span>
        </div>`;
      }).join('') +
      (list.length>5 ? `<button class="more" onclick="showAll=!showAll;drawRank()">${showAll?'收合':'顯示全部'+list.length+'張'}</button>` : '');
  }

  function drawChips(){
    document.getElementById('chips').innerHTML = CATS.map(c=>
      `<button class="chip-btn" data-k="${esc(c.key)}" onclick="pickChip(this.dataset.k)">${esc(c.key)}</button>`).join('');
  }

  // 原創卡面配色:以黃金角分散色相，每張卡顏色不同
  function faceBg(i){
    const h = Math.round((i * 137.5 + 210) % 360);
    const dark = i % 4 === 3;
    return dark
      ? `linear-gradient(135deg,hsl(${h},18%,16%),hsl(${h},22%,32%))`
      : `linear-gradient(135deg,hsl(${h},48%,30%),hsl(${(h+35)%360},55%,50%))`;
  }

  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function render(){
    const [y,m] = cur.split('-');
    document.getElementById('monthLabel').textContent = `${y}年${Number(m)}月`;
    const done = state.months[cur] || {};
    const n = offers.length;
    const d = offers.filter(c=>done[c.name]).length;
    const p = n ? Math.round(d/n*100) : 0;
    document.getElementById('prog').textContent = `已刷${d}/${n}張，剩${n-d}張`;
    document.getElementById('pct').textContent = p + '%';
    document.getElementById('barIn').style.width = p + '%';

    const shown = offers.filter(c=>{
      if(filter==='todo') return !done[c.name];
      if(filter==='done') return !!done[c.name];
      if(filter==='soon'){ const k = daysLeft(c.deadline); return k!==null && k>=0 && k<=30; }
      return true;
    });

    document.getElementById('list').innerHTML = shown.map(c=>{
      const k = daysLeft(c.deadline);
      const due = c.deadline
        ? `<span class="due ${k!==null&&k>=0&&k<=30?'soon':''}">${k!==null&&k<0?'已截止':'至'+esc(c.deadline.slice(5))}</span>`
        : '';
      const i = offers.indexOf(c);
      return `<div class="card ${done[c.name]?'done':''}">
        <div class="top">
          <div class="face" style="background:${faceBg(i)}" data-n="${esc(c.name)}" onclick="toggle(this.dataset.n,!state.months[cur]||!state.months[cur][this.dataset.n])" role="button" aria-label="切換${esc(c.name)}已刷狀態">
            <span class="chip"></span><span class="wave"></span>
            <span class="dots">•••• ••••</span><span class="no">${String(i+1).padStart(2,'0')}</span>
            <span class="tick">✓</span>
          </div>
          <div class="meta">
            <div class="name">${esc(c.name)}</div>
            <div class="hint">${done[c.name]?'本月已刷':'點卡片標記已刷'}</div>
            ${due}
          </div>
        </div>
        <ul>${c.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        ${c.register?`<div class="reg">注意:${esc(c.register)}</div>`:''}
        <div class="row">
          <input class="use" placeholder="用途,例:電信費自動扣繳" value="${esc(state.uses[c.name]||'')}" data-n="${esc(c.name)}" oninput="setUse(this.dataset.n,this.value)">
          <a class="src" href="${esc(c.source)}" target="_blank" rel="noopener">詳細</a>
        </div>
      </div>`;
    }).join('') || '<p class="note">沒有符合的卡片</p>';
    if(curCat) drawRank();
  }

  function backup(){
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    navigator.clipboard.writeText(code).then(()=>alert('備份碼已複製'));
  }
  function restore(){
    try{
      const s = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('restoreBox').value.trim()))));
      state = { uses:s.uses||{}, months:s.months||{} };
      save(); render(); alert('還原完成');
    }catch(e){ alert('備份碼格式錯誤'); }
  }

  fetch('offers.json?t=' + Date.now())
    .then(r=>r.json())
    .then(j=>{
      offers = j.cards;
      document.getElementById('updated').textContent = `優惠資料更新:${j.updated}`;
      drawChips();
      render();
    })
    .catch(()=>{ document.getElementById('updated').textContent = '優惠資料載入失敗'; });
</script>
</body>
</html>
