<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<title>婚禮倒數</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--g1:#fbefc8;--g2:#d9b25a;--g3:#9a7228;--rose:#e9b9b5}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(ellipse at 50% 28%,#2c2030 0%,#140f19 50%,#07060a 100%);color:#f3ead7;font-family:"Noto Serif TC",serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #bg{z-index:0}
  #fx{z-index:3;pointer-events:none}
  main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}

  .eyebrow{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.45em;color:var(--g2);padding-left:.45em;animation:up 1.2s .1s both}
  h1{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-style:italic;font-weight:500;font-size:clamp(40px,11vw,68px);line-height:1.15;margin:8px 0 4px;animation:up 1.2s .3s both}
  .gold{background:linear-gradient(100deg,var(--g3) 0%,var(--g1) 25%,var(--g2) 50%,var(--g1) 75%,var(--g3) 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
  h1.gold{animation:up 1.2s .3s both,shine 6s linear infinite}

  .rule{display:flex;align-items:center;gap:10px;width:min(280px,70vw);margin:10px auto 18px;animation:up 1.2s .5s both}
  .rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--g2))}
  .rule::after{background:linear-gradient(90deg,var(--g2),transparent)}
  .rule i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--g2)}

  .days{animation:up 1.4s .7s both}
  .days .num{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(110px,36vw,200px);line-height:.9;filter:drop-shadow(0 0 24px rgba(217,178,90,.35))}
  .days .label{font-size:14px;letter-spacing:.3em;color:var(--g2);margin-top:6px;padding-left:.3em}

  .dg{display:inline-block}
  .dg.roll{animation:roll .6s cubic-bezier(.2,.8,.2,1)}

  .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,4vw,24px);margin-top:28px;animation:up 1.4s .9s both}
  .ring{position:relative;width:clamp(86px,25vw,120px);aspect-ratio:1}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 4px rgba(251,239,200,.45))}
  .ring .track{fill:none;stroke:rgba(217,178,90,.14);stroke-width:2}
  .ring .bar{fill:none;stroke:url(#gg);stroke-width:3;stroke-linecap:round}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(28px,8.5vw,40px);color:var(--g1);line-height:1}
  .ring .unit{font-size:11px;letter-spacing:.2em;color:var(--g2);margin-top:4px;padding-left:.2em}

  .venue{margin-top:32px;animation:up 1.4s 1.1s both}
  .venue .zh{font-size:15px;letter-spacing:.2em;padding-left:.2em}
  .venue .en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14px;color:rgba(243,234,215,.55);margin-top:4px}
  .msg{font-size:16px;letter-spacing:.15em;color:var(--g1);margin-top:18px;min-height:1.4em}
  .hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;z-index:2;text-align:center;font-size:11px;letter-spacing:.2em;color:rgba(243,234,215,.35);animation:up 1.4s 1.6s both,breathe 3s 3s ease-in-out infinite}

  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes shine{to{background-position:200% center}}
  @keyframes roll{from{opacity:0;transform:translateY(-45%) scale(.9);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
  @keyframes breathe{50%{opacity:.4}}
  @media(max-height:640px){.days .num{font-size:min(30vw,120px)}.rings{margin-top:16px}.venue{margin-top:18px}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<main>
  <p class="eyebrow" id="date"></p>
  <h1 class="gold" id="title">We're Getting Married</h1>
  <div class="rule"><i></i></div>

  <div class="days">
    <div class="num" id="d"></div>
    <div class="label" id="dLabel">天 DAYS</div>
  </div>

  <div class="rings" id="rings">
    <div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" id="hBar" cx="50" cy="50" r="46"/></svg><div class="in"><div class="num" id="h"></div><div class="unit">時</div></div></div>
    <div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" id="mBar" cx="50" cy="50" r="46"/></svg><div class="in"><div class="num" id="m"></div><div class="unit">分</div></div></div>
    <div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" id="sBar" cx="50" cy="50" r="46"/></svg><div class="in"><div class="num" id="s"></div><div class="unit">秒</div></div></div>
  </div>

  <div class="venue">
    <div class="zh">台北文華東方酒店</div>
    <div class="en">Mandarin Oriental, Taipei</div>
  </div>
  <p class="msg" id="msg"></p>
</main>
<p class="hint">輕觸畫面放煙火</p>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbefc8"/><stop offset=".5" stop-color="#d9b25a"/><stop offset="1" stop-color="#9a7228"/></linearGradient>
</defs></svg>

<script>
// 婚禮時間(台灣時間)，要改時間只改這一行
const WEDDING = '2026-11-07T12:00:00+08:00';

const target = new Date(WEDDING).getTime();
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 日期列
const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false}).formatToParts(new Date(target)).map(x => [x.type, x.value]));
$('date').textContent = `${p.year}.${p.month}.${p.day} ${p.weekday.toUpperCase()} ${p.hour}:${p.minute}`;

// 數字變動時做滾動動畫
function setNum(el, str, gold){
  const old = el.dataset.v || '';
  if (old === str) return;
  el.dataset.v = str;
  if (old.length !== str.length) {
    el.innerHTML = [...str].map(c => `<span class="dg${gold ? ' gold' : ''}">${c}</span>`).join('');
    return;
  }
  [...str].forEach((c, i) => {
    if (c === old[i]) return;
    const s = el.children[i];
    s.textContent = c;
    s.classList.remove('roll'); void s.offsetWidth; s.classList.add('roll');
  });
}

// 圓環進度
const C = 2 * Math.PI * 46;
const bars = ['hBar','mBar','sBar'].map(id => { const b = $(id); b.style.strokeDasharray = C; return b; });
const setRing = (b, f) => b.style.strokeDashoffset = C * (1 - f);

let married = false;
function update(){
  const now = Date.now();
  const rem = target - now;
  if (rem > 0) {
    const sec = Math.floor(rem / 1000);
    setNum($('d'), String(Math.floor(sec / 86400)), true);
    setNum($('h'), pad(Math.floor(sec % 86400 / 3600)));
    setNum($('m'), pad(Math.floor(sec % 3600 / 60)));
    setNum($('s'), pad(sec % 60));
    setRing(bars[0], (rem % 86400000) / 86400000);
    setRing(bars[1], (rem % 3600000) / 3600000);
    setRing(bars[2], (rem % 60000) / 60000);
  } else {
    const days = Math.floor(-rem / 86400000) + 1;
    setNum($('d'), String(days), true);
    if (!married) {
      married = true;
      $('title').textContent = 'Just Married';
      $('dLabel').textContent = '結婚第幾天 DAYS MARRIED';
      $('rings').style.display = 'none';
      $('msg').textContent = days === 1 ? '今天結婚' : '';
      for (let i = 0; i < 6; i++) setTimeout(randomBurst, i * 350);
    }
    // 婚禮當天持續施放煙火
    if (days === 1 && Math.random() < 0.025) randomBurst();
  }
}

// ===== 背景：金色光點與花瓣 =====
const bg = $('bg'), bx = bg.getContext('2d');
const fx = $('fx'), fxx = fx.getContext('2d');
let W, H, dpr, dots = [], petals = [];
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [bg, fx]) { c.width = W * dpr; c.height = H * dpr; }
  bx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fxx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(Math.min(110, W * H / 9000) * (reduce ? .4 : 1));
  dots = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+.4, vy:-(Math.random()*.25+.05), vx:(Math.random()-.5)*.1, t:Math.random()*6.28, ts:Math.random()*.03+.01}));
  petals = reduce ? [] : Array.from({length:Math.round(W / 60) + 6}, newPetal);
}
function newPetal(init = true){
  return {x:Math.random()*W, y:init ? Math.random()*H : -20, s:Math.random()*6+5, vy:Math.random()*.5+.35, sw:Math.random()*1.5+.5, ph:Math.random()*6.28, rot:Math.random()*6.28, vr:(Math.random()-.5)*.03, a:Math.random()*.35+.25, gold:Math.random() < .35};
}
function drawBg(t){
  bx.clearRect(0, 0, W, H);
  bx.globalCompositeOperation = 'lighter';
  for (const d of dots) {
    d.y += d.vy; d.x += d.vx; d.t += d.ts;
    if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
    const a = (Math.sin(d.t) + 1) / 2 * .7 + .15;
    bx.fillStyle = `rgba(251,239,200,${a * .12})`;
    bx.beginPath(); bx.arc(d.x, d.y, d.r * 5, 0, 6.28); bx.fill();
    bx.fillStyle = `rgba(251,239,200,${a})`;
    bx.beginPath(); bx.arc(d.x, d.y, d.r, 0, 6.28); bx.fill();
  }
  bx.globalCompositeOperation = 'source-over';
  for (const pt of petals) {
    pt.y += pt.vy; pt.ph += .015; pt.rot += pt.vr;
    const x = pt.x + Math.sin(pt.ph) * pt.sw * 20;
    if (pt.y > H + 20) Object.assign(pt, newPetal(false));
    bx.save();
    bx.translate(x, pt.y); bx.rotate(pt.rot);
    bx.scale(1, Math.abs(Math.cos(pt.ph * 1.3)) * .6 + .4);
    bx.fillStyle = pt.gold ? `rgba(217,178,90,${pt.a})` : `rgba(233,185,181,${pt.a})`;
    bx.beginPath();
    bx.moveTo(0, -pt.s);
    bx.quadraticCurveTo(pt.s * .9, 0, 0, pt.s);
    bx.quadraticCurveTo(-pt.s * .9, 0, 0, -pt.s);
    bx.fill();
    bx.restore();
  }
}

// ===== 煙火 =====
const sparks = [];
const COLORS = ['251,239,200', '217,178,90', '233,185,181', '255,255,255', '246,214,150'];
function burst(x, y, big = 1){
  const n = Math.round((reduce ? 30 : 80) * big);
  const col = COLORS[Math.floor(Math.random() * COLORS.length)];
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * 6.28, sp = (Math.random() * 4 + 1.5) * big;
    const life = Math.random() * 40 + 60;
    sparks.push({x, y, px:x, py:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life, max:life, c:Math.random() < .3 ? '255,255,255' : col, heart:Math.random() < .08});
  }
}
function randomBurst(){ burst(W * (Math.random() * .7 + .15), H * (Math.random() * .35 + .12), Math.random() * .5 + .8); }
function heart(ctx, x, y, s){
  ctx.beginPath();
  ctx.moveTo(x, y + s * .3);
  ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * .35);
  ctx.bezierCurveTo(x - s, y + s * .8, x, y + s, x, y + s * 1.3);
  ctx.bezierCurveTo(x, y + s, x + s, y + s * .8, x + s, y + s * .35);
  ctx.bezierCurveTo(x + s, y, x, y, x, y + s * .3);
  ctx.fill();
}
function drawFx(){
  fxx.clearRect(0, 0, W, H);
  fxx.globalCompositeOperation = 'lighter';
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.px = s.x; s.py = s.y;
    s.vx *= .975; s.vy = s.vy * .975 + .045;
    s.x += s.vx; s.y += s.vy; s.life--;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    const a = s.life / s.max;
    if (s.heart) {
      fxx.fillStyle = `rgba(233,150,160,${a})`;
      heart(fxx, s.x, s.y, 4);
    } else {
      fxx.strokeStyle = `rgba(${s.c},${a})`;
      fxx.lineWidth = 1.6;
      fxx.beginPath(); fxx.moveTo(s.px - s.vx * 2, s.py - s.vy * 2); fxx.lineTo(s.x, s.y); fxx.stroke();
      if (Math.random() < .15) { fxx.fillStyle = `rgba(255,255,255,${a})`; fxx.fillRect(s.x, s.y, 1.5, 1.5); }
    }
  }
  fxx.globalCompositeOperation = 'source-over';
}

addEventListener('pointerdown', e => burst(e.clientX, e.clientY));
addEventListener('resize', resize);
resize();

function loop(t){
  update();
  drawBg(t);
  drawFx();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(() => { if (!married) { randomBurst(); setTimeout(randomBurst, 400); } }, 1400);
</script>
</body>
</html>
