<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde9d6">
<title>婚禮倒數</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#4a2e1f;--terra:#b5643a;--gold:#d99a4e;--sage:#7f9f86}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:linear-gradient(180deg,#fff3e6 0%,#fde3cc 40%,#f8c9a8 75%,#f2b08d 100%);color:var(--ink);font-family:"Noto Serif TC",serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #bg{z-index:0}
  #fx{z-index:4;pointer-events:none}
  .sun{position:fixed;left:50%;top:58%;width:130vmax;height:130vmax;transform:translate(-50%,-50%);z-index:0;border-radius:50%;background:radial-gradient(circle,rgba(255,236,200,.75) 0%,rgba(255,220,180,.25) 30%,transparent 60%);animation:pulse 8s ease-in-out infinite}
  main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px calc(150px + env(safe-area-inset-bottom));text-align:center}

  .eyebrow{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:13px;letter-spacing:.45em;color:var(--terra);padding-left:.45em;animation:up 1s .1s both}
  h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:clamp(38px,10.5vw,64px);line-height:1.1;margin:6px 0 2px;animation:up 1s .25s both}
  .warm{background:linear-gradient(100deg,#9c4f2b 0%,#d99a4e 30%,#b5643a 55%,#e3ad62 80%,#9c4f2b 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
  h1.warm{animation:up 1s .25s both,shine 6s linear infinite}
  .sub{font-size:13px;letter-spacing:.25em;color:rgba(74,46,31,.7);padding-left:.25em;animation:up 1s .4s both}

  .rule{display:flex;align-items:center;gap:10px;width:min(260px,66vw);margin:10px auto 8px;animation:up 1s .5s both}
  .rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .rule::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .rule svg{width:16px;height:16px}

  .days{animation:up 1.2s .6s both}
  .days .num{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(100px,32vw,180px);line-height:.92;filter:drop-shadow(0 4px 10px rgba(181,100,58,.25))}
  .days .label{font-size:14px;letter-spacing:.3em;color:var(--terra);margin-top:2px;padding-left:.3em}
  .dg{display:inline-block}
  .dg.roll{animation:roll .6s cubic-bezier(.2,.8,.2,1)}

  .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,4vw,22px);margin-top:20px;animation:up 1.2s .8s both}
  .ring{position:relative;width:clamp(80px,23vw,112px);aspect-ratio:1;background:rgba(255,250,243,.55);border-radius:50%;box-shadow:0 6px 18px rgba(181,100,58,.12);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:rgba(181,100,58,.13);stroke-width:3}
  .ring .bar{fill:none;stroke:url(#gg);stroke-width:4;stroke-linecap:round}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(26px,8vw,38px);color:var(--ink);line-height:1}
  .ring .unit{font-size:11px;letter-spacing:.2em;color:var(--terra);margin-top:3px;padding-left:.2em}

  .venue{margin-top:18px;animation:up 1.2s 1s both}
  .venue .zh{font-size:14px;letter-spacing:.2em;padding-left:.2em}
  .venue .en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14px;color:rgba(74,46,31,.55);margin-top:2px}
  .msg{font-size:15px;letter-spacing:.15em;color:var(--terra);margin-top:10px;min-height:1.3em}

  /* 矮袋鼠 */
  .couple{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 6px);transform:translateX(-50%);z-index:3;display:flex;align-items:flex-end;gap:2px;animation:rise 1.2s 1.1s both}
  .q{width:clamp(92px,25vw,124px);cursor:pointer;transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite}
  .q.b{animation-delay:-1.6s}
  .q svg{width:100%;display:block;overflow:visible}
  .q.hop{animation:hop .7s cubic-bezier(.3,.7,.4,1)}
  .q .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  .q.b .eye{animation-delay:-2.2s}
  .q.b svg{transform:scaleX(-1)}
  .mid{width:30px;margin-bottom:78px;animation:beat 1.3s ease-in-out infinite}
  .hint{font-size:10px;margin-top:2px;letter-spacing:.2em;color:rgba(74,46,31,.4)}

  /* 小遊戲 */
  .play{margin-top:12px;padding:10px 22px;border:0;border-radius:999px;background:linear-gradient(135deg,#d99a4e,#b5643a);color:#fff;font-family:inherit;font-size:14px;letter-spacing:.15em;box-shadow:0 6px 16px rgba(181,100,58,.3);cursor:pointer;animation:up 1.2s 1.2s both}
  .play:active{transform:scale(.96)}
  #game{position:fixed;inset:0;z-index:10;display:none;background:linear-gradient(180deg,#fff3e6 0%,#fde3cc 50%,#f6bf9c 100%);touch-action:none}
  #game.on{display:block}
  #gc{position:absolute;inset:0;width:100%;height:100%}
  .hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-family:"Cormorant Garamond",serif;font-weight:700;color:var(--ink);pointer-events:none}
  .hud .sc{font-size:34px}
  .hud .tm{font-size:22px;color:var(--terra)}
  .tbar{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:16px;right:16px;height:4px;border-radius:2px;background:rgba(181,100,58,.15);pointer-events:none}
  .tbar div{height:100%;border-radius:2px;background:linear-gradient(90deg,#e3ad62,#b5643a)}
  .xclose{position:absolute;top:calc(env(safe-area-inset-top) + 70px);right:12px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,250,243,.7);color:var(--ink);font-size:18px;cursor:pointer}
  .panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:min(340px,100%);background:rgba(255,250,243,.92);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:0 12px 40px rgba(120,60,30,.18)}
  .card h2{font-family:"Noto Serif TC",serif;font-size:22px;letter-spacing:.15em;margin-bottom:12px}
  .card .rules{font-size:14px;line-height:2;color:rgba(74,46,31,.8);margin-bottom:6px}
  .card .big{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:72px;line-height:1;color:var(--terra)}
  .card .best{font-size:13px;color:rgba(74,46,31,.6);margin:8px 0 16px}
  .card .rec{display:inline-block;font-size:12px;letter-spacing:.1em;color:#fff;background:#e8807a;border-radius:999px;padding:3px 10px;margin-bottom:6px}
  .card .btns{display:flex;gap:10px;justify-content:center}
  .card button{padding:10px 20px;border-radius:999px;font-family:inherit;font-size:14px;letter-spacing:.1em;cursor:pointer;border:1px solid var(--terra);background:transparent;color:var(--terra)}
  .card button.go{background:linear-gradient(135deg,#d99a4e,#b5643a);color:#fff;border:0}
  .card{max-height:88vh;overflow:auto}
  .lb{list-style:none;text-align:left;margin:4px 0 14px;font-size:14px}
  .lb li{display:flex;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(181,100,58,.15)}
  .lb li .rk{width:22px;color:var(--terra);font-family:"Cormorant Garamond",serif;font-weight:700;font-size:16px}
  .lb li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb li .pt{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:16px}
  .lb li.me{background:rgba(232,128,122,.12);border-radius:6px}
  .lb .empty{color:rgba(74,46,31,.5);justify-content:center}
  .lbt{font-size:13px;letter-spacing:.2em;color:var(--terra);margin-top:4px}
  .sub{display:flex;gap:8px;margin:4px 0 10px}
  .sub input{flex:1;min-width:0;padding:9px 12px;border:1px solid rgba(181,100,58,.4);border-radius:999px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink)}
  .sub button{flex:none}
  .lbmsg{font-size:12px;color:rgba(74,46,31,.6);min-height:1.2em;margin-bottom:6px}
  .hide{display:none!important}

  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes shine{to{background-position:200% center}}
  @keyframes roll{from{opacity:0;transform:translateY(-45%) scale(.9);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
  @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-1.5deg)}75%{transform:translateY(-2px) rotate(1.5deg)}}
  @keyframes hop{0%{transform:scale(1,1)}15%{transform:scale(1.08,.88)}45%{transform:translateY(-46px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.06,.92)}100%{transform:none}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
  @media(max-height:700px){.days .num{font-size:min(26vw,110px)}.rings{margin-top:12px}.ring{width:min(20vw,84px)}.venue{margin-top:10px}.q{width:min(22vw,92px)}main{padding-bottom:120px}.mid{margin-bottom:56px}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

  <div class="hud"><div class="sc" id="gScore">0</div><div class="tm" id="gTime">30.0</div></div>

<script>
// 婚禮時間(台灣時間)，要改時間只改這一行
const WEDDING = '2026-11-07T12:00:00+08:00';
// 排行榜Apps Script網址，留空則不顯示排行榜
const LEADERBOARD_URL = 'https://script.google.com/macros/s/AKfycbwdf4we0d3BxvMeqA4rbWRGbRGuTe6dGwB_PcvAODHwadMxSUxgbbht1zUtf8MsDV0a/exec';

const target = new Date(WEDDING).getTime();
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 日期列
const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false}).formatToParts(new Date(target)).map(x => [x.type, x.value]));
$('date').textContent = `${p.year}.${p.month}.${p.day} ${p.weekday.toUpperCase()} ${p.hour}:${p.minute}`;

// 數字變動時做滾動動畫
function setNum(el, str, warm){
  const old = el.dataset.v || '';
  if (old === str) return;
  el.dataset.v = str;
  if (old.length !== str.length) {
    el.innerHTML = [...str].map(c => `<span class="dg${warm ? ' warm' : ''}">${c}</span>`).join('');
    return;
  }
  [...str].forEach((c, i) => {
    if (c === old[i]) return;
    const s = el.children[i];
    s.textContent = c;
    s.classList.remove('roll'); void s.offsetWidth; s.classList.add('roll');
  });
}

// 圓環進度
const C = 2 * Math.PI * 45;
const bars = ['hBar','mBar','sBar'].map(id => { const b = $(id); b.style.strokeDasharray = C; return b; });
const setRing = (b, f) => b.style.strokeDashoffset = C * (1 - f);

// 矮袋鼠跳一下並冒愛心
function hop(el){
  el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop');
  const r = el.getBoundingClientRect();
  hearts(r.left + r.width / 2, r.top + r.height * .25, 10);
}
for (const q of [$('qa'), $('qb')]) {
  q.addEventListener('pointerdown', e => { e.stopPropagation(); hop(q); });
  q.addEventListener('animationend', e => { if (e.animationName === 'hop') q.classList.remove('hop'); });
}

let married = false, lastSec = -1;
function update(){
  const rem = target - Date.now();
  if (rem > 0) {
    const sec = Math.floor(rem / 1000);
    setNum($('d'), String(Math.floor(sec / 86400)), true);
    setNum($('h'), pad(Math.floor(sec % 86400 / 3600)));
    setNum($('m'), pad(Math.floor(sec % 3600 / 60)));
    setNum($('s'), pad(sec % 60));
    setRing(bars[0], (rem % 86400000) / 86400000);
    setRing(bars[1], (rem % 3600000) / 3600000);
    setRing(bars[2], (rem % 60000) / 60000);
    // 每分鐘整點兩隻輪流跳一下
    if (sec !== lastSec && sec % 60 === 0) { hop($('qa')); setTimeout(() => hop($('qb')), 350); }
    lastSec = sec;
  } else {
    const days = Math.floor(-rem / 86400000) + 1;
    setNum($('d'), String(days), true);
    if (!married) {
      married = true;
      $('title').textContent = 'Just Married';
      $('dLabel').textContent = '結婚第幾天 DAYS MARRIED';
      $('rings').style.display = 'none';
      $('msg').textContent = days === 1 ? '今天結婚' : '';
      for (let i = 0; i < 6; i++) setTimeout(randomBurst, i * 350);
      setInterval(() => { hop($('qa')); setTimeout(() => hop($('qb')), 300); }, 4000);
    }
    if (days === 1 && Math.random() < 0.02) randomBurst();
  }
}

// ===== 背景：光點、尤加利葉、花瓣 =====
const bg = $('bg'), bx = bg.getContext('2d');
const fx = $('fx'), fxx = fx.getContext('2d');
let W, H, dpr, dots = [], leaves = [];
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [bg, fx]) { c.width = W * dpr; c.height = H * dpr; }
  bx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fxx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(Math.min(60, W * H / 14000) * (reduce ? .4 : 1));
  dots = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.5+1, vy:-(Math.random()*.2+.05), t:Math.random()*6.28, ts:Math.random()*.02+.008}));
  leaves = reduce ? [] : Array.from({length:Math.round(W / 55) + 6}, newLeaf);
}
function newLeaf(init = true){
  const k = Math.random();
  return {x:Math.random()*W, y:init ? Math.random()*H : -20, s:Math.random()*6+6, vy:Math.random()*.5+.35, sw:Math.random()*1.4+.5, ph:Math.random()*6.28, rot:Math.random()*6.28, vr:(Math.random()-.5)*.03,
    kind:k < .5 ? 'leaf' : 'petal', color:k < .5 ? `rgba(127,159,134,${Math.random()*.3+.45})` : (k < .8 ? `rgba(242,156,150,${Math.random()*.3+.4})` : `rgba(255,255,255,${Math.random()*.3+.6})`)};
}
function drawBg(){
  bx.clearRect(0, 0, W, H);
  for (const d of dots) {
    d.y += d.vy; d.t += d.ts;
    if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
    const a = (Math.sin(d.t) + 1) / 2 * .5 + .2;
    bx.fillStyle = `rgba(255,255,255,${a * .25})`;
    bx.beginPath(); bx.arc(d.x, d.y, d.r * 4, 0, 6.28); bx.fill();
    bx.fillStyle = `rgba(255,255,255,${a})`;
    bx.beginPath(); bx.arc(d.x, d.y, d.r, 0, 6.28); bx.fill();
  }
  for (const l of leaves) {
    l.y += l.vy; l.ph += .015; l.rot += l.vr;
    const x = l.x + Math.sin(l.ph) * l.sw * 20;
    if (l.y > H + 20) Object.assign(l, newLeaf(false));
    bx.save();
    bx.translate(x, l.y); bx.rotate(l.rot);
    bx.scale(1, Math.abs(Math.cos(l.ph * 1.3)) * .6 + .4);
    bx.fillStyle = l.color;
    bx.beginPath();
    if (l.kind === 'leaf') {
      // 尤加利葉:細長葉片加葉脈
      bx.moveTo(0, -l.s * 1.4);
      bx.quadraticCurveTo(l.s * .7, 0, 0, l.s * 1.4);
      bx.quadraticCurveTo(-l.s * .7, 0, 0, -l.s * 1.4);
      bx.fill();
      bx.strokeStyle = 'rgba(255,255,255,.35)'; bx.lineWidth = .8;
      bx.beginPath(); bx.moveTo(0, -l.s * 1.2); bx.lineTo(0, l.s * 1.2); bx.stroke();
    } else {
      bx.moveTo(0, -l.s);
      bx.quadraticCurveTo(l.s * .9, 0, 0, l.s);
      bx.quadraticCurveTo(-l.s * .9, 0, 0, -l.s);
      bx.fill();
    }
    bx.restore();
  }
}

// ===== 彩紙與愛心 =====
const sparks = [];
const COLORS = ['#e8807a', '#d99a4e', '#b5643a', '#7f9f86', '#f6b3b0', '#f2c46a', '#ffffff'];
function heartPath(ctx, s){
  ctx.beginPath();
  ctx.moveTo(0, s * .3);
  ctx.bezierCurveTo(0, 0, -s, 0, -s, s * .35);
  ctx.bezierCurveTo(-s, s * .8, 0, s, 0, s * 1.3);
  ctx.bezierCurveTo(0, s, s, s * .8, s, s * .35);
  ctx.bezierCurveTo(s, 0, 0, 0, 0, s * .3);
  ctx.fill();
}
function burst(x, y, big = 1){
  const n = Math.round((reduce ? 25 : 70) * big);
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * 6.28, sp = (Math.random() * 4.5 + 1.5) * big;
    const life = Math.random() * 50 + 70;
    const r = Math.random();
    sparks.push({x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 1.5, life, max:life, c:COLORS[Math.floor(Math.random()*COLORS.length)],
      type:r < .18 ? 'heart' : (r < .6 ? 'paper' : 'dot'), s:Math.random()*4+3, rot:Math.random()*6.28, vr:(Math.random()-.5)*.3});
  }
}
function hearts(x, y, n){
  for (let i = 0; i < n; i++) {
    const life = Math.random() * 40 + 60;
    sparks.push({x:x + (Math.random()-.5)*40, y, vx:(Math.random()-.5)*1.5, vy:-(Math.random()*2+1.5), life, max:life, c:Math.random() < .7 ? '#e8807a' : '#f6b3b0', type:'heart', s:Math.random()*4+4, rot:(Math.random()-.5)*.6, vr:0, float:true});
  }
}
function randomBurst(){ burst(W * (Math.random() * .7 + .15), H * (Math.random() * .3 + .15), Math.random() * .4 + .8); }
function drawFx(){
  fxx.clearRect(0, 0, W, H);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    if (s.float) { s.vy *= .99; s.x += Math.sin(s.life * .1) * .4; }
    else { s.vx *= .97; s.vy = s.vy * .97 + .06; }
    s.x += s.vx; s.y += s.vy; s.rot += s.vr; s.life--;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    fxx.globalAlpha = Math.min(1, s.life / s.max * 1.6);
    fxx.fillStyle = s.c;
    fxx.save(); fxx.translate(s.x, s.y); fxx.rotate(s.rot);
    if (s.type === 'heart') heartPath(fxx, s.s * .8);
    else if (s.type === 'paper') { fxx.scale(1, Math.cos(s.rot * 2)); fxx.fillRect(-s.s/2, -s.s/4, s.s, s.s/2); }
    else { fxx.beginPath(); fxx.arc(0, 0, s.s * .35, 0, 6.28); fxx.fill(); }
    fxx.restore();
  }
  fxx.globalAlpha = 1;
}

// ===== 小遊戲:接尤加利葉 =====
let gameOpen = false;
(() => {
  const ov = $('game'), cv = $('gc'), g = cv.getContext('2d');
  const BEST_KEY = 'quokkaCatchBest';
  const getBest = () => { try { return +localStorage.getItem(BEST_KEY) || 0; } catch(e) { return 0; } };
  const setBest = v => { try { localStorage.setItem(BEST_KEY, v); } catch(e) {} };
  const DUR = 30;
  const TYPES = [
    {k:'leaf', p:.6, pts:1},
    {k:'heart', p:.17, pts:3},
    {k:'ring', p:.05, pts:5},
    {k:'bug', p:.18, pts:-3},
  ];
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">${$('quokka').innerHTML}<path d="M100 121l-15-9v18zM100 121l15-9v18z" fill="#2e2926"/><circle cx="100" cy="121" r="4.5" fill="#4a2e1f"/></svg>`);

  let w, h, dp, run = false, items = [], pops = [], score = 0, t0 = 0, last = 0, spawnAcc = 0;
  let qx = 0, tx = 0, qv = 0, squash = 0, shake = 0, raf = 0;
  const QW = () => Math.min(120, w * .27), QH = () => QW() * 1.3;
  const qy = () => h - QH() - Math.max(16, h * .03);

  function size(){
    dp = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dp; cv.height = h * dp;
    g.setTransform(dp, 0, 0, dp, 0, 0);
  }
  function showBest(){
    const b = getBest();
    $('gBest1').textContent = b ? `最高分 ${b}` : '';
    $('gBest2').textContent = `最高分 ${b}`;
  }
  // 排行榜
  const LB = !!LEADERBOARD_URL;
  let top = [], myName = '', uploaded = false;
  try { myName = localStorage.getItem('quokkaName') || ''; } catch(e) {}
  document.querySelectorAll('.lbwrap').forEach(el => el.classList.toggle('hide', !LB));
  function renderLb(){
    for (const [id, n] of [['lb1', 5], ['lb2', 10]]) {
      const ol = $(id); ol.textContent = '';
      if (!top.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '還沒有人上榜'; ol.append(li); continue; }
      top.slice(0, n).forEach((r, i) => {
        const li = document.createElement('li');
        if (myName && r.name === myName) li.className = 'me';
        for (const [c, t] of [['rk', i + 1], ['nm', r.name], ['pt', r.score]]) { const sp = document.createElement('span'); sp.className = c; sp.textContent = t; li.append(sp); }
        ol.append(li);
      });
    }
  }
  async function loadLb(){
    if (!LB) return;
    try { const r = await fetch(LEADERBOARD_URL); top = (await r.json()).top || []; renderLb(); } catch(e) {}
  }
  async function upload(){
    const name = $('gName').value.trim().slice(0, 12);
    if (!name) { $('gMsg').textContent = '請輸入暱稱'; return; }
    if (uploaded) return;
    $('gUp').disabled = true; $('gMsg').textContent = '上傳中';
    try {
      // text/plain避免跨網域預檢
      const r = await fetch(LEADERBOARD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({name, score})});
      const d = await r.json();
      if (!d.ok) throw 0;
      uploaded = true; myName = name;
      try { localStorage.setItem('quokkaName', name); } catch(e) {}
      top = d.top || top; renderLb();
      const rank = top.findIndex(x => x.name === name) + 1;
      $('gMsg').textContent = rank ? `已上傳，目前第${rank}名` : '已上傳，未進前10名';
      $('gSub').classList.add('hide');
    } catch(e) {
      $('gMsg').textContent = '上傳失敗，請再試一次';
      $('gUp').disabled = false;
    }
  }
  $('gUp').addEventListener('pointerdown', e => e.stopPropagation());
  $('gUp').addEventListener('click', upload);
  $('gName').addEventListener('pointerdown', e => e.stopPropagation());
  $('gName').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') upload(); });

  function open(){
    gameOpen = true; ov.classList.add('on'); size();
    qx = tx = w / 2; items = []; pops = []; score = 0;
    $('gScore').textContent = 0; $('gTime').textContent = DUR.toFixed(1); $('gBar').style.width = '100%';
    $('gStart').classList.remove('hide'); $('gEnd').classList.add('hide');
    showBest(); renderLb(); loadLb();
    cancelAnimationFrame(raf); idle();
  }
  function close(){ run = false; gameOpen = false; ov.classList.remove('on'); cancelAnimationFrame(raf); }
  function start(){
    $('gStart').classList.add('hide'); $('gEnd').classList.add('hide');
    items = []; pops = []; score = 0; $('gScore').textContent = 0;
    run = true; t0 = last = performance.now(); spawnAcc = 0;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function end(){
    run = false;
    const best = getBest(), rec = score > best;
    if (rec) setBest(score);
    $('gFinal').textContent = score;
    $('gRec').classList.toggle('hide', !rec || score === 0);
    showBest();
    uploaded = false;
    $('gName').value = myName; $('gUp').disabled = false;
    $('gSub').classList.toggle('hide', score === 0);
    $('gMsg').textContent = score === 0 ? '0分無法上傳' : '';
    renderLb(); loadLb();
    $('gEnd').classList.remove('hide');
    if (rec && score > 0) for (let i = 0; i < 4; i++) setTimeout(() => burstAt(w * (.2 + Math.random() * .6), h * (.15 + Math.random() * .2)), i * 250);
    idle();
  }
  // 結束畫面也保持動態
  function idle(){
    const step = () => { if (run || !gameOpen) return; draw(1 / 60, false); raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
  }

  function pick(){
    let r = Math.random();
    for (const t of TYPES) { if ((r -= t.p) < 0) return t; }
    return TYPES[0];
  }
  function spawn(prog){
    const t = pick(), sc = QW() / 110;
    items.push({t, x:24 + Math.random() * (w - 48), y:-30, s:(t.k === 'leaf' ? 13 : 12) * sc,
      vy:h * (.32 + prog * .45) * (.85 + Math.random() * .3), rot:Math.random() * 6.28, vr:(Math.random() - .5) * 3, ph:Math.random() * 6.28});
  }
  function pop(x, y, text, color){ pops.push({x, y, text, color, life:1}); }
  const sparksG = [];
  function burstAt(x, y){
    for (let i = 0; i < 50; i++) {
      const a = Math.random() * 6.28, sp = Math.random() * 260 + 80;
      sparksG.push({x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 80, life:1, c:COLORS[Math.floor(Math.random() * COLORS.length)], s:Math.random() * 4 + 3, heart:Math.random() < .2});
    }
  }
  function sparkle(x, y, c, n){
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, sp = Math.random() * 120 + 40;
      sparksG.push({x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp - 60, life:.7, c, s:Math.random() * 3 + 2, heart:false});
    }
  }

  function frame(now){
    if (!run) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const el = (now - t0) / 1000, left = Math.max(0, DUR - el), prog = Math.min(1, el / DUR);
    $('gTime').textContent = left.toFixed(1);
    $('gBar').style.width = (left / DUR * 100) + '%';
    spawnAcc += dt;
    const interval = .62 - prog * .32;
    while (spawnAcc > interval) { spawnAcc -= interval; spawn(prog); }
    draw(dt, true);
    if (left <= 0) { end(); return; }
    raf = requestAnimationFrame(frame);
  }

  function draw(dt, live){
    const qw = QW(), qh = QH(), y0 = qy();
    // 移動
    const prev = qx;
    qx += (tx - qx) * Math.min(1, dt * 14);
    qx = Math.max(qw * .4, Math.min(w - qw * .4, qx));
    qv = (qx - prev) / Math.max(dt, .001);
    squash = Math.max(0, squash - dt * 4);
    shake = Math.max(0, shake - dt * 3);

    g.clearRect(0, 0, w, h);

    // 掉落物
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt; it.rot += it.vr * dt; it.ph += dt * 3;
      const x = it.x + Math.sin(it.ph) * (it.t.k === 'leaf' ? 14 : 4);
      if (live && it.y > y0 + qh * .05 && it.y < y0 + qh * .4 && Math.abs(x - qx) < qw * .42) {
        items.splice(i, 1);
        score = Math.max(0, score + it.t.pts);
        $('gScore').textContent = score;
        if (it.t.k === 'bug') { shake = 1; pop(x, y0, '-3', '#7a4a3a'); try { navigator.vibrate && navigator.vibrate(80); } catch(e) {} }
        else { squash = 1; pop(x, y0, '+' + it.t.pts, it.t.k === 'leaf' ? '#5e8a68' : (it.t.k === 'heart' ? '#e8807a' : '#c48a3a')); sparkle(x, y0 + qh * .15, it.t.k === 'leaf' ? '#7f9f86' : (it.t.k === 'heart' ? '#f6b3b0' : '#f2c46a'), it.t.k === 'ring' ? 18 : 8); }
        continue;
      }
      if (it.y > h + 40) { items.splice(i, 1); continue; }
      drawItem(it, x);
    }

    // 矮袋鼠
    if (img.complete) {
      g.save();
      const sx = shake ? Math.sin(shake * 40) * 6 * shake : 0;
      g.translate(qx + sx, y0 + qh);
      g.rotate(Math.max(-.18, Math.min(.18, qv / 4000)));
      g.scale(1 + squash * .08, 1 - squash * .1);
      g.drawImage(img, -qw / 2, -qh, qw, qh);
      g.restore();
    }

    // 粒子與分數提示
    for (let i = sparksG.length - 1; i >= 0; i--) {
      const p = sparksG[i];
      p.vx *= .96; p.vy = p.vy * .96 + 400 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * .9;
      if (p.life <= 0) { sparksG.splice(i, 1); continue; }
      g.globalAlpha = Math.min(1, p.life * 1.5); g.fillStyle = p.c;
      if (p.heart) { g.save(); g.translate(p.x, p.y); heartPath(g, p.s * .8); g.restore(); }
      else { g.beginPath(); g.arc(p.x, p.y, p.s * .5, 0, 6.28); g.fill(); }
    }
    g.globalAlpha = 1;
    g.textAlign = 'center';
    g.font = '700 28px "Cormorant Garamond",serif';
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i];
      p.life -= dt * 1.4; p.y -= dt * 60;
      if (p.life <= 0) { pops.splice(i, 1); continue; }
      g.globalAlpha = p.life; g.fillStyle = p.color;
      g.fillText(p.text, p.x, p.y);
    }
    g.globalAlpha = 1;
  }

  function drawItem(it, x){
    const s = it.s;
    g.save(); g.translate(x, it.y);
    if (it.t.k === 'leaf') {
      g.rotate(it.rot);
      g.fillStyle = '#6f9878';
      g.beginPath(); g.moveTo(0, -s * 1.4); g.quadraticCurveTo(s * .75, 0, 0, s * 1.4); g.quadraticCurveTo(-s * .75, 0, 0, -s * 1.4); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, -s * 1.2); g.lineTo(0, s * 1.2); g.stroke();
    } else if (it.t.k === 'heart') {
      g.rotate(Math.sin(it.ph) * .25);
      g.fillStyle = '#e8807a'; g.translate(0, -s * .6); heartPath(g, s);
    } else if (it.t.k === 'ring') {
      g.rotate(Math.sin(it.ph) * .3);
      g.strokeStyle = '#d99a4e'; g.lineWidth = s * .28;
      g.beginPath(); g.arc(0, s * .25, s * .7, 0, 6.28); g.stroke();
      g.fillStyle = '#eaf6ff'; g.strokeStyle = '#9fc6dc'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(0, -s * 1.15); g.lineTo(s * .45, -s * .7); g.lineTo(0, -s * .35); g.lineTo(-s * .45, -s * .7); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(-s * .12, -s * .78, s * .08, 0, 6.28); g.fill();
    } else {
      // 蟲子
      g.rotate(Math.sin(it.ph * 2) * .2);
      g.strokeStyle = '#3b2f2a'; g.lineWidth = 1.6;
      for (const sy of [-.3, .1, .5]) for (const d of [-1, 1]) { g.beginPath(); g.moveTo(0, s * sy); g.lineTo(d * s * 1, s * (sy + .2)); g.stroke(); }
      g.fillStyle = '#4a3a33'; g.beginPath(); g.ellipse(0, s * .15, s * .6, s * .75, 0, 0, 6.28); g.fill();
      g.fillStyle = '#2e2926'; g.beginPath(); g.arc(0, -s * .65, s * .38, 0, 6.28); g.fill();
      g.strokeStyle = '#2e2926'; g.beginPath(); g.moveTo(-s * .15, -s * .95); g.lineTo(-s * .4, -s * 1.3); g.moveTo(s * .15, -s * .95); g.lineTo(s * .4, -s * 1.3); g.stroke();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(-s * .14, -s * .7, s * .1, 0, 6.28); g.arc(s * .14, -s * .7, s * .1, 0, 6.28); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, -s * .5); g.lineTo(0, s * .85); g.stroke();
    }
    g.restore();
  }

  // 操作:觸控拖曳或鍵盤左右
  cv.addEventListener('pointerdown', e => { tx = e.clientX; });
  cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure) tx = e.clientX; });
  addEventListener('keydown', e => {
    if (!gameOpen) return;
    if (e.key === 'ArrowLeft') tx = Math.max(0, qx - w * .18);
    if (e.key === 'ArrowRight') tx = Math.min(w, qx + w * .18);
    if (e.key === 'Escape') close();
  });
  for (const el of ['playBtn','gGo','gAgain','gBack','gClose']) $(el).addEventListener('pointerdown', e => e.stopPropagation());
  $('playBtn').addEventListener('click', open);
  $('gGo').addEventListener('click', start);
  $('gAgain').addEventListener('click', start);
  $('gBack').addEventListener('click', close);
  $('gClose').addEventListener('click', close);
  addEventListener('resize', () => { if (gameOpen) size(); });
})();

addEventListener('pointerdown', e => { if (!gameOpen) burst(e.clientX, e.clientY); });
addEventListener('resize', resize);
resize();

function loop(){
  update();
  drawBg();
  drawFx();
