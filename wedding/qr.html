<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#eee;font-family:"Noto Serif TC",serif;color:#4a2e1f;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tip{text-align:center;font-size:13px;color:#666;padding:12px}
  .sheet{width:210mm;height:297mm;margin:0 auto 12px;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

  .qr{width:40mm;height:40mm;display:block}
  .txt{font-size:11pt;line-height:1.7;letter-spacing:.1em;margin-top:4mm;font-weight:600}
  .sm{font-size:8.5pt;color:rgba(74,46,31,.65);letter-spacing:.1em;margin-top:1mm}
  .pair{position:absolute;bottom:2mm;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:1mm}
  .pair svg{width:24mm;height:auto;display:block}
  .pair svg.flip{transform:scaleX(-1)}
  .hrt{color:#e8807a;font-size:14pt;margin-bottom:12mm}
  @page{size:A4;margin:0}
  @media print{body{background:#fff}.tip{display:none}.sheet{margin:0}.card{border-color:#ccc}}
  @media screen and (max-width:820px){.sheet{zoom:.45}}
