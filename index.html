<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>材積計算器</title>
<style>
  body{font-family:-apple-system,"Noto Sans TC",sans-serif;background:#fff;color:#111;margin:0;padding:16px;max-width:480px}
  h1{font-size:20px;margin:0 0 16px}
  label{display:block;font-size:14px;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #999;border-radius:4px}
  button{margin-top:16px;width:100%;padding:12px;font-size:16px;background:#111;color:#fff;border:0;border-radius:4px}
  table{width:100%;margin-top:20px;border-collapse:collapse;font-size:15px}
  td{padding:8px 4px;border-bottom:1px solid #ddd}
  td:last-child{text-align:right;font-weight:600}
  .note{font-size:12px;color:#666;margin-top:16px}
</style>
</head>
<body>
<h1>材積計算器</h1>

<label>長(cm)</label><input id="l" type="number" inputmode="decimal">
<label>寬(cm)</label><input id="w" type="number" inputmode="decimal">
<label>高(cm)</label><input id="h" type="number" inputmode="decimal">
<label>件數</label><input id="q" type="number" inputmode="numeric" value="1">
<button onclick="calc()">計算</button>

<table>
  <tr><td>總體積(CBM)</td><td id="cbm">-</td></tr>
  <tr><td>才數</td><td id="cai">-</td></tr>
  <tr><td>空運材積重(kg,÷6000)</td><td id="air">-</td></tr>
  <tr><td>快遞材積重(kg,÷5000)</td><td id="exp">-</td></tr>
</table>

<p class="note">1才=30.3×30.3×30.3cm³。除數依各承攬商規定可能不同，請以合約為準。</p>

<script>
  // 參數集中於此，方便修改與在GitHub上比對差異
  const CAI_CM3 = 30.3 * 30.3 * 30.3;
  const AIR_DIVISOR = 6000;
  const EXPRESS_DIVISOR = 6000;

  function calc(){
    const l = +document.getElementById('l').value;
    const w = +document.getElementById('w').value;
    const h = +document.getElementById('h').value;
    const q = +document.getElementById('q').value || 1;
    const cm3 = l * w * h * q;
    document.getElementById('cbm').textContent = (cm3 / 1e6).toFixed(3);
    document.getElementById('cai').textContent = (cm3 / CAI_CM3).toFixed(2);
    document.getElementById('air').textContent = (cm3 / AIR_DIVISOR).toFixed(1);
    document.getElementById('exp').textContent = (cm3 / EXPRESS_DIVISOR).toFixed(1);
  }
</script>
</body>
</html>
